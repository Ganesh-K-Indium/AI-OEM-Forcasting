[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oem-forecasting-platform"
version = "1.0.0"
description = "AI-assisted OEM revenue forecasting platform (units -> ASP -> revenue)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy[asyncio]>=2.0", "greenlet>=3.0", "alembic>=1.13",
  "pydantic>=2.7", "pydantic-settings>=2.3", "celery>=5.4", "redis>=5.0",
  "pandas>=2.2", "numpy>=1.26", "scipy>=1.13", "statsmodels>=0.14", "scikit-learn>=1.5",
  "statsforecast>=2.0", "hierarchicalforecast>=1.2", "lightgbm>=4.3", "duckdb>=1.0", "pyarrow>=15",
  "rapidfuzz>=3.9", "pgvector>=0.3", "psycopg[binary]>=3.2", "pyjwt[crypto]>=2.8", "bcrypt>=4.1",
  "python-multipart>=0.0.9", "httpx>=0.27", "aiosqlite>=0.20", "anyio>=4.3",
]

[project.optional-dependencies]
foundation = ["torch>=2.2", "chronos-forecasting>=2.0"]
tirex = ["tirex-ts"]          # NXAI Community License - review before commercial use
dev = ["pytest>=8", "pytest-cov", "ruff"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: needs a live PostgreSQL+pgvector (TEST_POSTGRES_URL)", "slow: end-to-end pipeline tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
